<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juice</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- =========================================
         MAIN WEBSITE WRAPPER

         <main id="main-wrapper">

        <!-- =====================================
             HEADER / NAVIGATION
             ===================================== -->
        <header class="site-header">

            <!-- Logo -->
            <a href="#" class="logo-link" aria-label="Juice Home">
                <img
                    src="C:\Users\Asus Vivobook\Downloads\Juice-Slider-Images\Juice Slider Images\Juice logo.png"
                    alt="Juice"
                    class="site-logo"
                >
            </a>

            <!-- Desktop / Mobile navigation -->
            <nav class="main-navigation" aria-label="Main navigation">

                <a href="#" class="nav-link">Home</a>

                <a href="#products" class="nav-link">Products</a>

                <a href="#contact" class="nav-link">Contact</a>

            </nav>

            <!-- Place order button -->
            <a href="#order" class="order-button">
                <span>Place order</span>

                <span class="order-arrow" aria-hidden="true">
                    →
                </span>
            </a>

        </header>


        <!-- =====================================
             HERO / PRODUCT SLIDER
             ===================================== -->
        <section
            id="img-container"
            class="product-slider"
            aria-label="Juice products"
        >

            <!-- =================================
                 SLIDE 1 — GREEN / JUICY
                 ================================= -->
            <article
                class="slide active"
                data-slide="0"
                data-gradient="green"
            >

                <!-- Large background word -->
                <div class="background-word" aria-hidden="true">
                    JUICY
                </div>

                <!-- Splash -->
                <img
                    src="C:\Users\Asus Vivobook\Downloads\Juice-Slider-Images\Juice Slider Images\1. Green Splash.png"
                    alt="Juice splash"
                    class="product-splash"
                    aria-hidden="true"
                >

                <!-- Bottle -->
                <img
                    src="C:\Users\Asus Vivobook\Downloads\Juice-Slider-Images\Juice Slider Images\1. Green-Bottel-1.png"
                    alt="Green Suja juice"
                    class="product-bottle"
                >

            </article>


            <!-- =================================
                 SLIDE 2 — RED / BODY
                 ================================= -->
            <article
                class="slide"
                data-slide="1"
                data-gradient="pink"
            >

                <!-- Large background word -->
                <div class="background-word" aria-hidden="true">
                    BODY
                </div>

                <!-- Splash -->
                <img
                    src="C:\Users\Asus Vivobook\Downloads\Juice-Slider-Images\Juice Slider Images\2. Red Splash.png"
                    alt=""
                    class="product-splash"
                    aria-hidden="true"
                >

                <!-- Bottle -->
                <img
                    src="C:\Users\Asus Vivobook\Downloads\Juice-Slider-Images\Juice Slider Images\2. Red Bottel.png"
                    alt="Pink Suja juice"
                    class="product-bottle"
                >

            </article>


            <!-- =================================
                 SLIDE 3 — ORANGE / ZEST
                 ================================= -->
            <article
                class="slide"
                data-slide="2"
                data-gradient="orange"
            >

                <!-- Large background word -->
                <div class="background-word" aria-hidden="true">
                    ZEST
                </div>

                <!-- Splash -->
                <img
                    src="C:\Users\Asus Vivobook\Downloads\Juice-Slider-Images\Juice Slider Images\3. Orange Splash.png"
                    alt=""
                    class="product-splash"
                    aria-hidden="true"
                >

                <!-- Bottle -->
                <img
                    src="C:\Users\Asus Vivobook\Downloads\Juice-Slider-Images\Juice Slider Images\3. Orange Bottle.png"
                    alt="Orange Suja juice"
                    class="product-bottle"
                >

            </article>


            <!-- =================================
                 SLIDE 4 — PURPLE / PURE
                 ================================= -->
            <article
                class="slide"
                data-slide="3"
                data-gradient="purple"
            >

                <!-- Large background word -->
                <div class="background-word" aria-hidden="true">
                    PURE
                </div>

                <!-- Splash -->
                <img
                    src="C:\Users\Asus Vivobook\Downloads\Juice-Slider-Images\Juice Slider Images\4. Purple Splash.png"
                    alt=""
                    class="product-splash"
                    aria-hidden="true"
                >

                <!-- Bottle -->
                <img
                    src="C:\Users\Asus Vivobook\Downloads\Juice-Slider-Images\Juice Slider Images\4. Purple Bottle.png"
                    alt="Purple Suja juice"
                    class="product-bottle"
                >

            </article>

        </section>


        <!-- =====================================
             HERO ACTION BUTTONS
             ===================================== -->
        <div class="hero-actions">

            <a href="#products" class="hero-button hero-button-primary">
                Products
            </a>

            <a href="#contact" class="hero-button hero-button-secondary">
                Contact
            </a>

        </div>


        <!-- =====================================
             SOCIAL MEDIA LINKS
             ===================================== -->
        <div class="social-links" aria-label="Social media">

            <a href="#" class="social-link" aria-label="Instagram">
                <span class="social-icon instagram-icon">
                    ◎
                </span>
            </a>

            <a href="#" class="social-link" aria-label="Facebook">
                <span class="social-icon facebook-icon">
                    f
                </span>
            </a>

            <a href="#" class="social-link" aria-label="Dribbble">
                <span class="social-icon dribbble-icon">
                    ◉
                </span>
            </a>

            <a href="#" class="social-link" aria-label="Behance">
                <span class="social-icon behance-icon">
                    Bē
                </span>
            </a>

        </div>


        <!-- =====================================
             BOTTOM SIZE NAVIGATION
             ===================================== -->
        <div class="size-navigation">

            <span class="size-line size-line-left"></span>

            <button
                type="button"
                class="size-button"
                aria-label="Choose your size"
            >
                Choose your size
            </button>

            <span class="size-line size-line-right"></span>

        </div>


        <!-- =====================================
             SLIDER CONTROLS
             ===================================== -->
        <div
            class="slider-controls"
            aria-label="Product slider navigation"
        >

            <button
                type="button"
                class="slider-dot active"
                data-slide-target="0"
                aria-label="Go to green juice"
                aria-current="true"
            ></button>

            <button
                type="button"
                class="slider-dot"
                data-slide-target="1"
                aria-label="Go to pink juice"
            ></button>

            <button
                type="button"
                class="slider-dot"
                data-slide-target="2"
                aria-label="Go to orange juice"
            ></button>

            <button
                type="button"
                class="slider-dot"
                data-slide-target="3"
                aria-label="Go to purple juice"
            ></button>

        </div>

    </main>


    <!-- =========================================
         JAVASCRIPT
         ========================================= -->
    <script src="script.js"></script>

</body>
</html>
